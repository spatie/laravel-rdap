name: run-tests

on:
  - push
  - pull_request

jobs:
  test:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        php: [8.6, 8.5, 8.4, 8.3, 8.2]
        laravel: [^12.0, ^13.0]
        dependency-version: [prefer-lowest, prefer-stable]
        include:
          - laravel: ^12.0
            testbench: ^10.0
          - laravel: ^13.0
            testbench: ^11.0
          - php: 8.5
            pest: ^4.7
            pest-plugin-laravel: ^4.1
          - php: 8.6
            pest: ^5.3
            pest-plugin-laravel: ^5.0
        exclude:
          - laravel: ^13.0
            php: 8.2
          - laravel: ^12.0
            php: 8.6

    name: P${{ matrix.php }} - L${{ matrix.laravel }} - ${{ matrix.dependency-version }} - ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick
          coverage: none

      - name: Select current test tooling
        if: matrix.pest != ''
        run: composer require --dev "pestphp/pest:${{ matrix.pest }}" "pestphp/pest-plugin-laravel:${{ matrix.pest-plugin-laravel }}" --no-interaction --no-update

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --${{ matrix.dependency-version }} --prefer-dist --no-interaction

      - name: Execute tests
        run: vendor/bin/pest
